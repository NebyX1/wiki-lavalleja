{% extends "admin/base.html" %}

{% block title %}Biblioteca multimedia - Admin Panel{% endblock %}

{% block extra_head %}
<meta name="csrf-token" content="{{ csrf_token() }}">
{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Biblioteca multimedia</h1>
</div>

<div class="mb-6">
    <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-400 transition-colors">
        <svg class="w-12 h-12 mx-auto text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <p class="text-sm text-slate-600">Arrastra imágenes aquí o haz clic para subir</p>
        <p class="text-xs text-slate-400 mt-1">JPEG, PNG o WebP — máx. 10 MB</p>
        <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp" class="hidden">
    </div>
</div>

<form method="GET" class="mb-4">
    <input type="text" name="q" value="{{ request.args.get('q', '') }}" placeholder="Buscar por nombre, alt o crédito..." class="w-full max-w-md px-4 py-2 text-sm border border-slate-300 rounded-lg">
</form>

<div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4"></div>

<div id="media-pagination" class="flex items-center justify-center gap-2 mt-6"></div>

<script>
const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
const isPicker = new URLSearchParams(window.location.search).has('picker');

async function loadMedia(page = 1) {
    const q = new URLSearchParams(window.location.search).get('q') || '';
    const res = await fetch(`/api/v1/admin/media?page=${page}&q=${q}`, { headers: { 'X-CSRFToken': csrfToken || '' } });
    if (!res.ok) return;
    const data = await res.json();
    const grid = document.getElementById('media-grid');
    grid.innerHTML = '';
    data.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-xl border border-slate-200 overflow-hidden cursor-pointer hover:border-blue-400 transition-colors';
        div.innerHTML = `
            <img src="/api/v1/media/${item.uuid}/content/small" alt="${item.altText || ''}" class="w-full h-32 object-cover">
            <div class="p-2">
                <p class="text-xs text-slate-600 truncate">${item.originalFilename || 'Sin nombre'}</p>
                <p class="text-xs text-slate-400">${(item.sizeBytes / 1024).toFixed(0)} KB</p>
            </div>
        `;
        div.onclick = () => selectMedia(item);
        grid.appendChild(div);
    });

    const pagination = data.pagination;
    const pagDiv = document.getElementById('media-pagination');
    pagDiv.innerHTML = '';
    if (pagination.pages > 1) {
        for (let i = 1; i <= pagination.pages; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `px-3 py-1 text-sm border rounded ${i === pagination.page ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-300 hover:bg-slate-50'}`;
            btn.onclick = () => loadMedia(i);
            pagDiv.appendChild(btn);
        }
    }
}

function selectMedia(item) {
    if (isPicker && window.opener) {
        window.opener.postMessage({ type: 'media-selected', mediaId: item.id, mediaUuid: item.uuid, altText: item.altText }, '*');
        window.close();
    }
}

// File upload
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => uploadFiles(e.target.files));

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-400', 'bg-blue-50'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-blue-400', 'bg-blue-50'); });
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-blue-400', 'bg-blue-50');
    uploadFiles(e.dataTransfer.files);
});

async function uploadFiles(files) {
    for (const file of files) {
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch('/api/v1/admin/media', {
                method: 'POST',
                headers: { 'X-CSRFToken': csrfToken || '' },
                body: formData,
            });
            if (res.ok) {
                loadMedia();
            } else {
                const err = await res.json();
                alert(err.error?.message || 'Error al subir');
            }
        } catch (e) {
            alert('Error de conexión');
        }
    }
}

loadMedia();
</script>
{% endblock %}
