{% extends "admin/base.html" %}

{% block title %}Revisiones - Admin Panel{% endblock %}

{% block extra_head %}
<meta name="csrf-token" content="{{ csrf_token() }}">
{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('admin.article_list') }}" class="text-sm text-slate-500 hover:text-blue-600">&larr; Volver a artículos</a>
</div>

<h1 class="text-2xl font-bold text-slate-900 mb-6">Revisiones de "{{ article.title }}"</h1>

<div id="revisions-list" class="space-y-3">
    <div class="text-center text-slate-400">Cargando...</div>
</div>

<script>
const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
const articleId = {{ article.id }};

async function loadRevisions() {
    const res = await fetch(`/api/v1/admin/articles/${articleId}/revisions`, { headers: { 'X-CSRFToken': csrfToken || '' } });
    if (!res.ok) return;
    const revisions = await res.json();
    const container = document.getElementById('revisions-list');
    container.innerHTML = '';

    if (revisions.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-400 py-8">No hay revisiones registradas.</div>';
        return;
    }

    revisions.forEach(rev => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between bg-white rounded-xl p-4 border border-slate-200';
        div.innerHTML = `
            <div>
                <span class="font-semibold text-slate-900">Revisión #${rev.revisionNumber}</span>
                <span class="text-sm text-slate-500 ml-3">${new Date(rev.createdAt).toLocaleString('es-UY')}</span>
                ${rev.createdByName ? `<span class="text-sm text-slate-400 ml-3">${rev.createdByName}</span>` : ''}
                ${rev.reason ? `<span class="text-sm text-slate-400 ml-3">${rev.reason}</span>` : ''}
            </div>
            <div class="space-x-2">
                <button onclick="restoreRevision(${rev.id})" class="px-3 py-1 text-xs text-blue-600 hover:underline">Restaurar</button>
            </div>
        `;
        container.appendChild(div);
    });
}

async function restoreRevision(revId) {
    if (!confirm('¿Restaurar esta revisión? Se creará una nueva revisión con los datos actuales antes de restaurar.')) return;
    const res = await fetch(`/api/v1/admin/articles/${articleId}/revisions/${revId}/restore`, {
        method: 'POST',
        headers: { 'X-CSRFToken': csrfToken || '' },
    });
    if (res.ok) {
        alert('Revisión restaurada.');
        loadRevisions();
    } else {
        const err = await res.json();
        alert(err.error?.message || 'Error');
    }
}

loadRevisions();
</script>
{% endblock %}
